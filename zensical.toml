[project]
site_name = "probo-mcp"
site_description = "A read-only MCP server for EG ProBo owners' association portals: messages, news, documents and an interactive browser for Claude."
site_author = "Kilian Tscherny"
site_url = "https://kiliantscherny.github.io/probo-mcp/"
copyright = "Copyright &copy; 2026 Kilian Tscherny · Not affiliated with EG A/S"
repo_url = "https://github.com/kiliantscherny/probo-mcp"
repo_name = "kiliantscherny/probo-mcp"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "get-started/index.md",
    "get-started/claude-desktop.md",
    "get-started/claude-code.md",
    "get-started/other-clients.md",
  ] },
  { "Configuration" = "configuration.md" },
  { "Features" = [
    "features/tools.md",
    "features/resources.md",
    "features/prompts.md",
    "features/interactive-browser.md",
  ] },
  { "How it works" = "how-it-works.md" },
  { "MCP 2.0 showcase" = "mcp-showcase.md" },
  { "Privacy & security" = "security.md" },
  { "Development" = "development.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
