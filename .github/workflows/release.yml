name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Builds and tests with a read-only token; nothing here can change the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uvx --with tox-uv==1.37.9 tox@4.67.15 -e 3.14,lint,type
      - run: uv build
      - run: uv run --frozen scripts/build_mcpb.py
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.mcpb > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/SHA256SUMS

  publish:
    # The only job that can write: it attests and publishes what `build` produced, and runs no project code.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # Attestations need a public repository (or GitHub Enterprise); SHA256SUMS is published either way.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/SHA256SUMS
